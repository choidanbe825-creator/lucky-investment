<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🍀 행운의 투자왕</title><link rel="stylesheet" href="./style.css"></head><body><main class="wrap"><header><div>🍀 행운의반 금융수학 프로젝트</div><h1>행운의 투자왕</h1><p>비례배분 투자 챌린지</p><span class="tag" id="phase">연결 중...</span></header>
<section class="card" id="login"><h2>🌱 꼬마 투자자 등록</h2><p>나의 번호와 이름을 입력하고 투자를 시작해요!</p><label for="number">나의 번호</label><select id="number"><option value="">번호를 선택하세요</option></select><label for="name">나의 이름</label><input id="name" maxlength="20" placeholder="이름을 입력하세요" autocomplete="off"><button class="bigbutton" id="join">🍀 투자 챌린지 시작하기</button><p class="muted">번호는 처음 한 번만 등록해요. 같은 기기·브라우저에서 이어서 참여할 수 있어요.</p><p id="loginmsg" class="error"></p></section>
<section class="card hidden" id="play"><h2 id="roundtitle">ROUND 1</h2><p id="notice" class="status"></p><div id="roundcontent"></div></section>
<section class="card hidden" id="history"><h2>📋 나의 투자 기록</h2><div id="records"></div></section><p class="muted center">※ 회사·뉴스·수익률은 수업용 가상 설정입니다. 실제 투자가 아닙니다.</p></main>
<script type="module">
import {db,auth,PRINCIPAL,RATES,money,verify,result} from './common.js';
import {signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {doc,onSnapshot,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id),numbers=[...Array.from({length:14},(_,i)=>i+1),...Array.from({length:10},(_,i)=>i+51)];
$('number').innerHTML+=numbers.map(n=>`<option value="${n}">${n}번</option>`).join('');
let uid=null,session={round:0,phase:'waiting'},mine={},registered=false,step='edit',drafts={},studentName='',studentNumber=0,unsubMine=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>drafts[session.round]||(drafts[session.round]={a:'',b:'',x:'',y:''});
const fmtRate=n=>(n>0?'+':'')+n+'%';
const news=[['생활 필수품 판매 증가!','신형 로봇 개발 성공!'],['대형 마트 공급 계약 체결!','로봇 제품 결함 발견!'],['원재료 가격 안정!','해외 로봇 수출 계약 성공!']];
function render(){const r=session.round||0,p=session.phase||'waiting';$('phase').textContent=r?`ROUND ${r} · ${p==='open'?'투자 접수 중':p==='closed'?'접수 마감':p==='revealed'?'결과 공개':'대기'}`:'수업 시작 대기';$('login').classList.toggle('hidden',registered);$('play').classList.toggle('hidden',!registered);$('history').classList.toggle('hidden',!registered);if(!registered)return;
$('roundtitle').textContent=r?`🍀 ROUND ${r} · ${p==='revealed'?'결과 발표':p==='open'?'투자 진행 중':'투자 대기'} · 투자금 ${money(PRINCIPAL)}`:'🍀 투자 시작을 기다려요';const d=mine[r];let notice='';if(!r)notice='선생님이 첫 라운드를 시작할 때까지 기다려요.';else if(p==='open')notice=d?'투자가 확정되었어요. 결과 공개를 기다려요!':'학습지에 계산한 뒤 투자금을 입력하세요.';else if(p==='closed')notice='투자가 마감되었어요. 결과 공개를 기다려요.';else if(p==='revealed')notice='이번 라운드 결과가 공개되었어요!';else notice='다음 라운드를 기다려요.';$('notice').textContent=notice;
const box=$('roundcontent');if(!r){box.innerHTML='<div class="summary center">🍀 준비되면 선생님이 시작해요!</div>';}else if(p==='revealed'&&d){const rate=RATES[r-1],val=result(d,rate);box.innerHTML=`<h2 class="center">🎉 ROUND ${r} 결과 발표!</h2><div class="company"><strong>🧼 매일생활 ${fmtRate(rate.a)}</strong><p>${news[r-1][0]}</p></div><div class="company" style="margin-top:10px"><strong>🤖 미래로봇 ${fmtRate(rate.b)}</strong><p>${news[r-1][1]}</p></div><div class="summary center"><p>이번 라운드 최종 자산</p><div class="metric">${money(val)}</div><strong>${val>=PRINCIPAL?'이익 +':'손실 -'}${money(Math.abs(val-PRINCIPAL))}</strong></div><p class="muted center">결과를 학습지에 기록해 보세요. 다음 라운드는 선생님이 시작해요!</p>`;}else if(d){box.innerHTML=`<div class="summary center"><h2>✔ 투자 확정 완료!</h2><p>매일생활 : 미래로봇 = ${d.a} : ${d.b}</p><p>🧼 ${money(d.x)} / 🤖 ${money(d.y)}</p><p>🔒 결과 공개 전까지 수익률은 비밀이에요.</p></div>`;}else if(p!=='open'){box.innerHTML='<div class="summary center">🔒 이번 라운드 투자 접수가 종료되었어요.</div>';}else if(step==='check'){const v=current();box.innerHTML=`<div class="steps"><span>1. 입력</span><span class="active">2. 확인</span><span>3. 확정</span></div><h2>✔ 비례배분 계산 성공!</h2><p>투자 확정 전에 마지막으로 확인해 보세요.</p><div class="summary"><div class="center"><p>매일생활 : 미래로봇</p><div class="metric">${v.a} : ${v.b}</div></div><div class="moneyrow"><span>🧼 매일생활</span><strong>${money(Number(v.x))}</strong></div><div class="moneyrow"><span>🤖 미래로봇</span><strong>${money(Number(v.y))}</strong></div><div class="moneyrow"><span>총 투자금</span><strong>1,000,000원</strong></div></div><p class="notice-warm">🔒 투자 확정 후에는 수정할 수 없어요.</p><div class="btnrow"><button class="secondary" id="editagain">✏️ 다시 수정하기</button><button id="confirm">🍀 이대로 투자 확정하기</button></div><p class="error" id="submitmsg"></p>`;$('editagain').onclick=()=>{step='edit';render()};$('confirm').onclick=submit;}else{const v=current();box.innerHTML=`<div class="steps"><span class="active">1. 입력</span><span>2. 확인</span><span>3. 확정</span></div><h2>✏️ 나의 투자 계획</h2><p class="sub">이전 라운드의 결과를 참고해 이번 투자 비율을 새롭게 정해 보세요!</p><div class="company-intro"><div class="intro-heading">🏢 투자할 두 회사를 알아봐요!</div><p class="intro-desc">회사마다 하는 일과 투자 위험이 달라요. 소개를 읽고 내 투자 전략을 세워 보세요.</p><div class="companies company-showcase"><article class="company company-profile everyday"><div class="company-art"><img src="./assets/everyday.svg" alt="치약, 비누, 휴지 등 생활용품 그림"></div><div class="company-body"><span class="company-kicker">🌿 생활 필수품 기업</span><h2>🧼 매일생활</h2><p class="company-lead">우리 생활에 꼭 필요한 물건을 만들어요!</p><p>치약·비누·휴지 등 매일 사용하는 제품을 생산해요. 생활에 필요한 제품이라 꾸준히 찾는 사람이 있을 수 있어요.</p><div class="company-fact"><strong>💚 기대할 점</strong><span>일상에서 자주 사용하는 물건을 판매해요.</span></div><div class="company-fact"><strong>☁️ 생각할 위험</strong><span>원재료 가격이 오르거나 경쟁이 심해지면 이익이 줄 수 있어요.</span></div></div></article><article class="company company-profile future"><div class="company-art"><img src="./assets/robot.svg" alt="귀여운 인공지능 가정용 로봇 그림"></div><div class="company-body"><span class="company-kicker">🚀 미래 기술 기업</span><h2>🤖 미래로봇</h2><p class="company-lead">사람을 돕는 똑똑한 로봇을 개발해요!</p><p>AI 가정용 로봇과 스마트 가전을 연구하고 만들어요. 새로운 기술이 성공하면 빠르게 성장할 수 있어요.</p><div class="company-fact"><strong>🧡 기대할 점</strong><span>새 제품이 인기를 얻으면 매출이 크게 늘 수 있어요.</span></div><div class="company-fact"><strong>⚡ 생각할 위험</strong><span>개발에 실패하거나 제품에 문제가 생기면 손실이 커질 수 있어요.</span></div></div></article></div><div class="invest-tip">🍀 <strong>투자 팁!</strong> 수익률은 미리 알 수 없어요. 두 회사의 특징을 비교하고 자신만의 비율을 결정해 보세요.</div></div><div class="summary center"><p>이번 라운드 새 투자금</p><div class="metric">1,000,000원</div></div><p>📒 학습지에 먼저 비례배분을 계산해 보세요.</p><h3>① 투자 비율</h3><div class="row"><div><label for="ra">매일생활</label><input id="ra" type="number" min="0" step="1" value="${esc(v.a)}" placeholder="예: 2"></div><div><label for="rb">미래로봇</label><input id="rb" type="number" min="0" step="1" value="${esc(v.b)}" placeholder="예: 3"></div></div><h3>② 직접 계산한 투자금</h3><label for="xa">매일생활 (원)</label><input id="xa" type="number" min="0" step="1" value="${esc(v.x)}" placeholder="예: 400000"><label for="xb">미래로봇 (원)</label><input id="xb" type="number" min="0" step="1" value="${esc(v.y)}" placeholder="예: 600000"><p class="muted" id="sum"></p><button class="bigbutton" id="checkbtn">계산 결과 확인하기 →</button><p class="error" id="checkmsg"></p>`;for(const [id,key] of [['ra','a'],['rb','b'],['xa','x'],['xb','y']])$(id).oninput=e=>{current()[key]=e.target.value;sum()};function sum(){$('sum').textContent='현재 입력한 투자금 합계: '+money((Number(current().x)||0)+(Number(current().y)||0))}sum();$('checkbtn').onclick=()=>{const q=current(),a=Number(q.a),b=Number(q.b),x=Number(q.x),y=Number(q.y);if([q.a,q.b,q.x,q.y].some(z=>z==='')||!verify(x,y,a,b)){$('checkmsg').textContent='투자금 합계 100만 원과 비례배분 비율이 일치하는지 확인해 주세요. 금액은 정수 원 단위로 입력해요.';return}step='check';render()};}
let total=0,count=0;let html='<p class="muted">이전 라운드의 결과는 다음 라운드에서도 확인할 수 있어요.</p><table><tr><th>라운드</th><th>비율</th><th>결과</th></tr>';for(let i=1;i<=3;i++){const v=mine[i];if(!v)continue;const revealed=i<r||(i===r&&p==='revealed');const val=revealed?result(v,RATES[i-1]):null;if(revealed){total+=val;count++}html+=`<tr><td>${i}R</td><td>${v.a}:${v.b}</td><td>${val===null?'공개 전':money(val)}</td></tr>`;if(revealed){const rate=RATES[i-1];html+=`<tr class="history-detail"><td colspan="3"><strong>🎉 ${i}라운드 결과</strong><div>🧼 매일생활 ${fmtRate(rate.a)} · 🤖 미래로봇 ${fmtRate(rate.b)}</div><div>이번 라운드 ${val>=PRINCIPAL?'이익 +':'손실 -'}${money(Math.abs(val-PRINCIPAL))}</div></td></tr>`;}}html+='</table>';if(count===3)html+=`<div class="summary center"><h2>🏆 3라운드 투자 완료!</h2><p>총 투자 원금 3,000,000원</p><div class="metric">${money(total)}</div><p>총 손익 ${money(total-3000000)}</p><p>어떤 전략을 바꿨나요? 학습지에 돌아보기를 작성해요.</p></div>`;$('records').innerHTML=html;
}
async function submit(){const r=session.round,v=current(),d={a:Number(v.a),b:Number(v.b),x:Number(v.x),y:Number(v.y)};try{await runTransaction(db,async tx=>{const st=await tx.get(doc(db,'investMeta','session'));const ref=doc(db,'investStudents',uid);const stu=await tx.get(ref);if(st.data()?.round!==r||st.data()?.phase!=='open')throw Error('라운드 접수가 마감되었어요.');if(stu.data()?.investments?.[r])throw Error('이미 확정한 투자입니다.');tx.update(ref,{[`investments.${r}`]:d});});step='edit';render()}catch(e){$('submitmsg').textContent=e.message}}
$('join').onclick=async()=>{const n=Number($('number').value),name=$('name').value.trim();if(!numbers.includes(n)||!name){$('loginmsg').textContent='번호를 선택하고 이름을 입력하세요.';return}try{const studentRef=doc(db,'investStudents',auth.currentUser.uid),claimRef=doc(db,'investNumbers',String(n));await runTransaction(db,async tx=>{const claim=await tx.get(claimRef),stu=await tx.get(studentRef);if(stu.exists()){if(stu.data().number!==n||stu.data().name!==name)throw Error('이미 등록된 정보와 달라요.');return}if(claim.exists())throw Error('이미 등록된 번호예요. 선생님께 확인해 주세요.');tx.set(claimRef,{uid:auth.currentUser.uid});tx.set(studentRef,{number:n,name,investments:{},createdAt:serverTimestamp()});});uid=auth.currentUser.uid;registered=true;studentName=name;studentNumber=n;render()}catch(e){$('loginmsg').textContent=e.message}};
function listenMine(){if(unsubMine)unsubMine();unsubMine=onSnapshot(doc(db,'investStudents',uid),s=>{mine=s.data()?.investments||{};render()},e=>{$('phase').textContent='기록 읽기 오류: '+e.message})}
onAuthStateChanged(auth,user=>{if(!user)return;uid=user.uid;onSnapshot(doc(db,'investStudents',uid),s=>{if(s.exists()){registered=true;studentName=s.data().name;studentNumber=s.data().number;$('number').value=String(studentNumber);$('name').value=studentName;mine=s.data().investments||{}}render()},e=>{$('loginmsg').textContent=e.message});onSnapshot(doc(db,'investMeta','session'),s=>{const prev=session.round;session=s.data()||{round:0,phase:'waiting'};if(prev!==session.round)step='edit';render()},e=>{$('phase').textContent='수업 상태 오류: '+e.message})});signInAnonymously(auth).catch(e=>$('loginmsg').textContent='익명 인증을 활성화해 주세요: '+e.message);
</script></body></html>
