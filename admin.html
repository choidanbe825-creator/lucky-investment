<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사용 | 투자 챌린지</title><link rel="stylesheet" href="./style.css"></head><body><main class="wrap"><header><h1>🍀 교사용 투자 대시보드</h1><p>비례배분 투자 챌린지 · 관리자 전용</p></header><section class="card" id="login"><h2>관리자 로그인</h2><label>이메일</label><input id="email" type="email"><label>비밀번호</label><input id="password" type="password"><button id="signin">로그인</button><p class="error" id="err"></p></section><div id="dashboard" class="hidden"><section class="card"><div class="row"><h2 id="phase">대기 중</h2><button class="secondary" id="signout">로그아웃</button></div><p id="msg" class="status"></p><button id="start">1라운드 시작</button><button id="close" class="secondary">투자 마감</button><button id="reveal">결과 공개</button><button id="next">다음 라운드 시작</button><p class="muted">결과 공개 시 미리 설정한 수익률이 적용됩니다. 모든 라운드에 새 투자금 100만 원을 사용합니다.</p></section><section class="card"><h2>제출 현황</h2><p class="metric" id="count">0 / 21명</p><div class="progress"><div class="fill" id="bar" style="width:0%"></div></div><div id="students"></div><p class="muted" id="unregistered"></p></section><section class="card"><h2>회사별 투자금</h2><div id="totals"></div></section><section class="card"><h2>라운드별 수익률 (교사만 미리 확인)</h2><div id="rates"></div></section><section class="card"><h2>누적 결과</h2><div id="ranking"></div><button id="export" class="secondary">CSV 내려받기</button></section><section class="card"><h2>수업 초기화</h2><p class="muted">테스트 기록을 지우려면 Firebase 콘솔에서 investStudents 및 investNumbers 컬렉션의 학생 문서를 함께 삭제한 뒤 초기화하세요. 초기화는 학생 기록을 삭제하지 않습니다.</p><button id="reset" class="danger">라운드 상태 초기화</button></section></div></main><script type="module">
import {db,auth,RATES,PRINCIPAL,money,result} from './common.js';
import {signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {doc,collection,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const $=id=>document.getElementById(id);let state={round:0,phase:'waiting'},students=[],isAdmin=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('signin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('err').textContent=e.message}};$('signout').onclick=()=>signOut(auth);
function draw(){const r=state.round||0,p=state.phase;$('phase').textContent=r?`${r}라운드 · ${p==='open'?'접수 중':p==='closed'?'마감':p==='revealed'?'공개 완료':'대기'}`:'시작 대기';const count=students.filter(s=>s.investments?.[r]).length;$('count').textContent=`${count} / 21명`;$('bar').style.width=(count/21*100)+'%';$('start').disabled=r!==0;$('close').disabled=!r||p!=='open';$('reveal').disabled=!r||p!=='closed';$('next').disabled=!r||r>=3||p!=='revealed';$('unregistered').textContent=`등록 ${students.length}명 / 21명 · 미등록 ${Math.max(0,21-students.length)}명 · 미제출 등록 학생 ${students.filter(s=>!s.investments?.[r]).map(s=>s.number+'번').join(', ')||'없음'}`;$('students').innerHTML='<table><tr><th>번호·이름</th><th>제출</th></tr>'+students.slice().sort((a,b)=>a.number-b.number).map(s=>`<tr><td>${s.number}번 ${esc(s.name)}</td><td>${s.investments?.[r]?'✓ 완료':'대기'}</td></tr>`).join('')+'</table>';let x=0,y=0;students.forEach(s=>{const v=s.investments?.[r];if(v){x+=v.x;y+=v.y}});$('totals').innerHTML=`<p>매일생활 <strong>${money(x)}</strong></p><p>미래로봇 <strong>${money(y)}</strong></p><p>가장 많은 투자금: <strong>${x===y?'동률':x>y?'매일생활':'미래로봇'}</strong></p>`;$('rates').innerHTML=RATES.map((v,i)=>`<p>${i+1}R: 매일생활 ${v.a>0?'+':''}${v.a}% / 미래로봇 ${v.b>0?'+':''}${v.b}%</p>`).join('');let rows=students.map(s=>{let sum=0,n=0;for(let i=1;i<=3;i++){const v=s.investments?.[i];if(v&&(i<r||(i===r&&p==='revealed'))){sum+=result(v,RATES[i-1]);n++}}return {...s,sum,n}}).sort((a,b)=>b.sum-a.sum);$('ranking').innerHTML='<table><tr><th>학생</th><th>확정 라운드</th><th>누적 자산</th></tr>'+rows.map(s=>`<tr><td>${s.number}번 ${esc(s.name)}</td><td>${s.n}회</td><td>${money(s.sum)}</td></tr>`).join('')+'</table>';}
async function change(next,expected){if(!confirm('진행 상태를 변경할까요?'))return;try{await runTransaction(db,async tx=>{const ref=doc(db,'investMeta','session');const snap=await tx.get(ref);const now=snap.exists()?snap.data():{round:0,phase:'waiting'};if(now.round!==expected.round||now.phase!==expected.phase)throw Error('상태가 변경되었습니다. 새로 확인하세요.');tx.set(ref,next);});$('msg').textContent='진행 상태 변경 완료'}catch(e){$('msg').textContent=e.message}}
$('start').onclick=()=>change({round:1,phase:'open'},state);$('close').onclick=()=>change({round:state.round,phase:'closed'},state);$('reveal').onclick=()=>change({round:state.round,phase:'revealed'},state);$('next').onclick=()=>change({round:state.round+1,phase:'open'},state);$('reset').onclick=()=>{if(prompt('초기화하려면 RESET을 입력하세요.')==='RESET')change({round:0,phase:'waiting'},state)};
$('export').onclick=()=>{const header=['번호','이름',...Array.from({length:3},(_,i)=>[`${i+1}R 비 A`,`${i+1}R 비 B`,`${i+1}R 매일생활`,`${i+1}R 미래로봇`,`${i+1}R 결과`]).flat()];const lines=[header,...students.map(s=>[s.number,s.name,...Array.from({length:3},(_,i)=>{const v=s.investments?.[i+1];return v?[v.a,v.b,v.x,v.y,result(v,RATES[i])]:['','','','','']}).flat()])];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='비례배분_투자결과.csv';a.click();URL.revokeObjectURL(url)};
onAuthStateChanged(auth,async user=>{if(!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}try{const {getDoc}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js');const admin=await getDoc(doc(db,'investAdmins',user.uid));if(!admin.exists()||admin.data().enabled!==true)throw Error('관리자 권한이 없습니다. investAdmins 문서를 확인하세요.');isAdmin=true;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');onSnapshot(doc(db,'investMeta','session'),s=>{state=s.data()||{round:0,phase:'waiting'};draw()},e=>$('msg').textContent=e.message);onSnapshot(collection(db,'investStudents'),s=>{students=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>$('msg').textContent=e.message)}catch(e){$('err').textContent=e.message;await signOut(auth)}});
</script></body></html>
